[project]
name = "pump-bot"
version = "0.1.0"
description = "Solana Pump Momentum & Liquidity Scalping Bot"
requires-python = ">=3.11"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ['(^|/)(\.venv|venv|build|dist)/', '^tests/']

[[tool.mypy.overrides]]
module = ["solders.*", "base58.*", "uvloop.*", "pandas.*", "numpy.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 88
exclude = [".venv", "venv", "build", "dist", ".ruff_cache", ".mypy_cache"]

[tool.ruff.lint]
select = [
    "E4", "E7", "E9",   # синтаксические ошибки pycodestyle
    "F",                # pyflakes: неопределённые и неиспользуемые имена
    "W",                # предупреждения pycodestyle
    "I",                # порядок импортов
    "UP",               # устаревшие конструкции под текущую версию Python
    "B",                # баги и подозрительные конструкции
    "SIM",              # избыточные конструкции
    "RUF",              # правила самого ruff
    "PL",               # pylint
    "ISC",              # неявная конкатенация строк
    "TRY",              # обработка исключений
    "PYI",              # соглашения о type stub-разметке
]
ignore = [
    # loguru использует "{}"-плейсхолдеры, а правило проверяет %-формат logging.
    "PLE1205",
    # Модули намеренно держат широкий except в фоновых задачах.
    "BLE001",
    # Формат сообщений задаётся в utils/logger.py, здесь дублировать не нужно.
    "TRY003", "EM101", "EM102",
    # Документация и сообщения проекта — на русском: кириллица здесь ожидаема.
    "RUF001", "RUF002", "RUF003",
    # Пороги-литералы в расчётах AMM/Solana читаются лучше именованных констант.
    "PLR2004",
    # Конфигуратор логгера обновляет модульный флаг ровно один раз.
    "PLW0603",
    # Число аргументов и веток возврата задано внешними интерфейсами (RPC, API).
    "PLR0911", "PLR0913",
]

[tool.ruff.lint.per-file-ignores]
# Тесты намеренно работают с приватными членами и «магическими» значениями.
"tests/*" = ["SLF001", "PLR2004"]
# Публичные реэкспорты пакетов описываются через __all__.
"*/__init__.py" = ["F401"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
